plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "collections-of-optimizations-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Jared Maven'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Curios Maven'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'MinecraftForge Maven'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    implementation 'curse.maven:xaeros-minimap-263420:8849842'
    implementation 'curse.maven:xaeros-world-map-317780:8849973'
    implementation 'curse.maven:lootr-361276:8968561'
    implementation 'curse.maven:artifacts-312353:8791899'
    implementation 'curse.maven:placebo-283644:8463693'
    implementation 'curse.maven:zeta-968868:7980010'
    implementation "curse.maven:architectury-api-419699:8492726"
    implementation 'curse.maven:ftb-chunks-forge-314906:8791113'
    implementation 'curse.maven:ftb-library-forge-404465:9008089'
    implementation 'curse.maven:ftb-ranks-forge-314905:8878560'
    implementation 'curse.maven:ftb-teams-forge-404468:8724782'
    implementation 'vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE'
    implementation 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    implementation 'com.github.glitchfiend:TerraBlender-neoforge:1.21.1-4.1.0.8'

    // Optional A-C targets audited against their NeoForge 1.21.1 jars.
    compileOnly('maven.modrinth:ambientsounds:6.3.9') { transitive = false }
    compileOnly('maven.modrinth:balm:21.0.66+neoforge-1.21.1') { transitive = false }
    //compileOnly('maven.modrinth:better-combat:2.4.0+1.21.1-neoforge') { transitive = false }
    compileOnly('maven.modrinth:caelus:7.0.1+1.21.1') { transitive = false }
    //compileOnly('maven.modrinth:create:6.0.10+mc1.21.1') { transitive = false }
    //compileOnly('maven.modrinth:cucumber:8.0.16') { transitive = false }

    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
