plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "collections-of-optimizations-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Jared Maven'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Curios Maven'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'MinecraftForge Maven'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'Bawnorton Maven'
        url = 'https://maven.bawnorton.com/releases'
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    implementation 'curse.maven:zeta-968868:7980010'
    implementation "curse.maven:architectury-api-419699:8492726"
    implementation 'curse.maven:ftb-chunks-forge-314906:8791113'
    implementation 'curse.maven:ftb-library-forge-404465:9008089'
    implementation 'curse.maven:ftb-ranks-forge-314905:8878560'
    implementation 'curse.maven:ftb-teams-forge-404468:8724782'
    implementation 'vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE'
    implementation 'com.github.glitchfiend:TerraBlender-neoforge:1.21.1-4.1.0.8'

    // Optional A-C targets audited against their NeoForge 1.21.1 jars.
    compileOnly('maven.modrinth:balm:21.0.66+neoforge-1.21.1') { transitive = false }
    compileOnly('maven.modrinth:ad-astra:1.16.26') { transitive = false }
    compileOnly('maven.modrinth:armageddon:v3.1.2') { transitive = false }
    compileOnly('maven.modrinth:ars-additions:21.3.0') { transitive = false }
    compileOnly('maven.modrinth:ars-nouveau:5.13.2') { transitive = false }
    compileOnly('maven.modrinth:ars-n-spells:3.3.5') { transitive = false }
    compileOnly('maven.modrinth:chimes:2.1.1') { transitive = false }
    compileOnly('maven.modrinth:better-combat:2.4.0+1.21.1-neoforge') { transitive = false }
    compileOnly('maven.modrinth:biolith:3.0.14') { transitive = false }
    compileOnly('maven.modrinth:oh-the-biomes-weve-gone:2.6.0-NeoForge') { transitive = false }
    compileOnly('maven.modrinth:cable-facades:2.1.4') { transitive = false }
    compileOnly('maven.modrinth:copycats:3.0.9+mc.1.21.1-neoforge') { transitive = false }
    compileOnly('maven.modrinth:create:6.0.10+mc1.21.1') { transitive = false }
    compileOnly('maven.modrinth:createaddition:neoforge-1.21.1-1.7.2') { transitive = false }
    compileOnly('maven.modrinth:cucumber:8.0.16') { transitive = false }
    compileOnly('maven.modrinth:dungeoncrawl:2.3.17') { transitive = false }
    compileOnly('maven.modrinth:dungeons_delight:1.5.1') { transitive = false }
    compileOnly('maven.modrinth:easy-villagers:neoforge-1.21.1-1.1.42') { transitive = false }
    compileOnly('maven.modrinth:farmers-delight:1.21.1-1.3.4') { transitive = false }
    compileOnly('maven.modrinth:fancymenu:3.9.14-1.21.1-neoforge') { transitive = false }
    compileOnly('com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.4')
    compileOnly('maven.modrinth:caelus:7.0.1+1.21.1') { transitive = false }

    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
